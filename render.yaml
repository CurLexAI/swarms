services:
  - type: web
    name: SR.BSM
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm ci --include=dev && npm run test:render-public && npm run check:cdn-sri && npm run check:render-config
    startCommand: npm start
    port: 10000
    healthCheckPath: /healthz
    autoDeploy: false
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-origin
      - path: /*
        name: Content-Security-Policy
        value: default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'
    # Render service: srv-d5uin6p4tr6s73e0d89g
    # Public domain: www.lexprim.com
    # Internal address: sr-bsm:10000 over HTTP inside Render private networking.
    # This service serves the public trust surface only. Agent runtimes and
    # private Modal endpoints remain backend-only and must not be exposed here.
    envVars:
      - key: NODE_ENV
        value: production
