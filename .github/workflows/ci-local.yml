name: CI Local

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements-agent.txt

      - name: Syntax check agents
        run: python3 -m py_compile .agents/*.py

      - name: Python tests
        run: python3 -m pytest -q tests/

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Install Node deps
        run: npm ci --include=dev

      - name: Node tests
        run: npm test

      - name: ADR-0001 boundary gate
        run: bash scripts/commander/adr-0001-boundary-gate.sh .

      - name: Agent presence gate
        run: bash scripts/commander/agent-presence-gate.sh .
