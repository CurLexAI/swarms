name: frontend-sri

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sri-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run integrity:frontend
      - run: npm run check:cdn-sri
      - run: npm run test:cdn-sri
