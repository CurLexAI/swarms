name: PDPL Article 22 Ingestion

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      RAG_INGEST_API_TOKEN: ${{ secrets.RAG_INGEST_API_TOKEN }}
      RAG_VERIFY_API_TOKEN: ${{ secrets.RAG_VERIFY_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate required secrets
        run: |
          set -euo pipefail
          for key in MODAL_TOKEN_ID MODAL_TOKEN_SECRET RAG_INGEST_API_TOKEN RAG_VERIFY_API_TOKEN; do
            if [ -z "${!key:-}" ]; then
              echo "FAILED_AT_PHASE_SECRET_VALIDATION: missing $key" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-agent.txt

      - name: Modal auth check
        run: |
          set -euo pipefail
          modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"
          modal profile current

      - name: Ensure ingestion entrypoint exists
        run: |
          set -euo pipefail
          test -f .agents/ingest_test.py || { echo "FAILED_AT_PHASE_FILE_CHECK: .agents/ingest_test.py missing" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }

      - name: Deploy ingestion app
        id: deploy
        run: |
          set -euo pipefail
          modal deploy .agents/ingest_test.py 2>&1 | tee modal_deploy.log
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import sys

          text = open("modal_deploy.log", encoding="utf-8", errors="ignore").read()
          for output_name, endpoint_label in (
              ("ingest_endpoint", "pdpl-ingest"),
              ("verify_endpoint", "pdpl-verify"),
          ):
              matches = re.findall(
                  rf"https://[^\s]*{endpoint_label}[^\s]*\.modal\.run", text
              )
              if not matches:
                  print(f"FAILED_AT_PHASE_DEPLOY: {endpoint_label} endpoint not found")
                  sys.exit(1)
              print(f"{output_name}={matches[-1]}")
          PY

      - name: Trigger ingestion and verification endpoints
        run: |
          set -euo pipefail
          ingest_endpoint='${{ steps.deploy.outputs.ingest_endpoint }}'
          verify_endpoint='${{ steps.deploy.outputs.verify_endpoint }}'
          ingest_http_code=$(curl -sS -o ingestion_response.json -w '%{http_code}' \
            -H "Authorization: Bearer $RAG_INGEST_API_TOKEN" \
            -H 'Content-Type: application/json' \
            -X POST "$ingest_endpoint" \
            --data '{}')
          if [ "$ingest_http_code" -lt 200 ] || [ "$ingest_http_code" -ge 300 ]; then
            echo "FAILED_AT_PHASE_INGEST_ENDPOINT_CALL: HTTP $ingest_http_code" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          verify_http_code=$(curl -sS -o verification_response.json -w '%{http_code}' \
            -H "Authorization: Bearer $RAG_VERIFY_API_TOKEN" \
            -H 'Content-Type: application/json' \
            -X POST "$verify_endpoint" \
            --data '{"query":"نقل البيانات الشخصية خارج المملكة"}')
          if [ "$verify_http_code" -lt 200 ] || [ "$verify_http_code" -ge 300 ]; then
            echo "FAILED_AT_PHASE_VERIFY_ENDPOINT_CALL: HTTP $verify_http_code" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Validate Qdrant and semantic search evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          try:
              ingestion=json.load(open('ingestion_response.json','r',encoding='utf-8'))
              verification=json.load(open('verification_response.json','r',encoding='utf-8'))
          except Exception as e:
              print(f'FAILED_AT_PHASE_RESPONSE_PARSE: {e}')
              sys.exit(1)
          collection=(ingestion.get('collection') if isinstance(ingestion,dict) else None)
          count=(ingestion.get('chunks_ingested') if isinstance(ingestion,dict) else None)
          query=(verification.get('query') if isinstance(verification,dict) else None)
          hits=(verification.get('hits') if isinstance(verification,dict) else None)
          if collection!='qarar_regulatory_test':
              print('FAILED_AT_PHASE_QDRANT_COLLECTION')
              sys.exit(1)
          if not isinstance(count,int) or count < 3:
              print('FAILED_AT_PHASE_QDRANT_POINT_COUNT')
              sys.exit(1)
          if query!='نقل البيانات الشخصية خارج المملكة':
              print('FAILED_AT_PHASE_SEMANTIC_QUERY')
              sys.exit(1)
          if not isinstance(hits,list) or not hits:
              print('FAILED_AT_PHASE_SEMANTIC_HITS')
              sys.exit(1)
          open('step_verdict.txt','w',encoding='utf-8').write('INGESTION_VERIFIED_END_TO_END\n')
          print('INGESTION_VERIFIED_END_TO_END')
          PY

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdpl-article22-ingestion-evidence
          path: |
            modal_deploy.log
            ingestion_response.json
            verification_response.json

      - name: Write execution report
        if: always()
        run: |
          {
            echo '## INGESTION EXECUTION REPORT'
            echo ''
            if grep -q 'INGESTION_VERIFIED_END_TO_END' "$GITHUB_WORKSPACE"/step_verdict.txt 2>/dev/null; then
              echo 'VERDICT:'
              echo '  ✓ INGESTION_VERIFIED_END_TO_END'
            else
              echo 'VERDICT:'
              echo '  FAILED_AT_PHASE_* (see step logs)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
